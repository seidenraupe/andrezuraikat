<!DOCTYPE html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Redaktion — André Zuraikat</title>
    <link rel="icon" href="../media/logo-z.png" type="image/png" />
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      .edit-gate { max-width: 32rem; }
      .edit-gate h1 { font-size: clamp(2rem, 4vw, 2.7rem); }
      .edit-gate form,
      .edit-access {
        background: var(--card);
        border: 1px solid var(--line);
        padding: 1.1rem;
      }
      .edit-gate label { font-weight: 800; }
      .edit-gate input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        min-height: 2.8rem;
        margin: 0.4rem 0 1rem;
        padding: 0.45rem 0.7rem;
        font: inherit;
        border: 1px solid var(--line);
        background: #fff;
      }
      .edit-actions { display: flex; flex-wrap: wrap; gap: 0.7rem; }
      .edit-actions .button { border: 0; cursor: pointer; }
      .edit-gate form .button { width: 100%; margin-top: 0.35rem; border: 0; cursor: pointer; }
      .edit-access { list-style: none; margin: 1rem 0 0; padding-left: 1.1rem; }
      .edit-access li {
        display: flex;
        justify-content: space-between;
        gap: 0.8rem;
        align-items: center;
        margin: 0.45rem 0;
      }
      .edit-error { background: #fde8e8; color: #7f1d1d; padding: 0.7rem 0.9rem; }
    </style>
  </head>
  <body>
    <main id="inhalt" class="section">
      <div class="wrap edit-gate">
        <p class="kicker">André Zuraikat</p>
        <h1>Redaktions-Modus</h1>
        <div id="edit-gate"></div>
      </div>
    </main>
    <script type="module" src="../js/edit-login.js"></script>
  </body>
</html>
